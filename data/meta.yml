indicator:
  name: Cold-Related Deaths
  slug: cold-related-deaths
  publisher: U.S. Environmental Protection Agency
  source_page: https://19january2025snapshot.epa.gov/climate-indicators/climate-change-indicators-cold-related-deaths
  technical_documentation: https://19january2025snapshot.epa.gov/sites/default/files/2021-04/documents/cold-deaths_td.pdf
  rights: Public domain, work of the U.S. Government (17 U.S.C. 105)
datasets:
- file: cold_deaths_annual.csv
  figure: Figure 1
  figure_title: Figure 1. Deaths Classified as “Cold-Related” in the United States,
    1979–2016
  source_file: cold-deaths_figure-1-and-TD1_04-08-19.xlsx
  source_sheet: Data for Figure 1
  source_sha256: 4751ee5bb2a82e84581f64d006e1497c21d0877fa001c214ba73f5ec9fb943d5
  data_source: CDC, 2018
  web_update: April 2021
  unit: death rate per million people
  rows: 55
  columns:
  - name: year
    type: integer
    description: Calendar year
  - name: series_key
    type: string
    description: Machine-readable series identifier
  - name: series_label
    type: string
    description: Display label
  - name: icd_revision
    type: string
    description: 'ICD revision in force for that year: ICD-9 through 1998, ICD-10
      from 1999. Added by this build; not a column in the source workbook.'
  - name: measure
    type: string
    description: What is measured
  - name: unit
    type: string
    description: Unit of `value`
  - name: value
    type: number
    description: Death rate, rounded to 8 decimal places (see data-raw/PROVENANCE.md).
  series:
  - key: underlying
    label: Underlying cause of death
    coverage: 1979-2016
    note: Deaths for which exposure to excessive natural cold was the underlying cause.
      Values before and after the ICD-9 to ICD-10 change are not directly comparable,
      which is why EPA draws this line with a break.
  - key: underlying_or_contributing
    label: Underlying and contributing causes of death
    coverage: 1999-2015
    note: Deaths for which cold was the underlying or a contributing cause. Based
      on a broader analysis that, at present, can only be evaluated for 1999-2015.
- file: cold_deaths_monthly.csv
  figure: Figure TD-1
  figure_title: Figure TD-1. Deaths Classified as “Cold-Related” in the United States
    by Month, 1999–2015
  source_file: cold-deaths_figure-1-and-TD1_04-08-19.xlsx
  source_sheet: Data for Figure TD-1
  source_sha256: 4751ee5bb2a82e84581f64d006e1497c21d0877fa001c214ba73f5ec9fb943d5
  data_source: CDC, 2018b
  web_update: March 2018
  unit: deaths
  rows: 12
  columns:
  - name: month
    type: string
    description: Calendar month name
  - name: month_num
    type: integer
    description: Calendar month, 1 = January
  - name: measure
    type: string
    description: What is measured
  - name: unit
    type: string
    description: 'Unit of `value`: a count, not a rate'
  - name: value
    type: integer
    description: Total deaths for that calendar month, summed over 1999-2015
  note: Not on EPA's published indicator page -- this is EPA's own supplementary Figure
    TD-1 from the technical documentation, built here as a second figure because the
    data exists and shows the seasonal pattern behind Figure 1's underlying-or-contributing
    series. See data-raw/PROVENANCE.md.
